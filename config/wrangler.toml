name            = "caoba-leads"
main            = "../worker/index.js"
compatibility_date = "2024-01-01"
routes = [
  { pattern = "caobaquintas.com/api/*", zone_name = "caobaquintas.com" }
]

[[d1_databases]]
binding  = "DB"
database_name = "caoba-leads"
database_id   = "9a64e966-57d7-4bc2-a281-6fb103253a16"

[vars]
NOTIFY_EMAIL = "udmr343@gmail.com"

# Este archivo vive en config/. Invocá wrangler con --config config/wrangler.toml desde la raíz.
# Secrets (NO van aquí — usa: npx wrangler secret put RESEND_API_KEY --config config/wrangler.toml)
# RESEND_API_KEY = "re_..."
# ADMIN_PASSWORD  — contraseña del panel /api/admin (usuario admin). Obligatoria: sin ella el panel responde 503.
